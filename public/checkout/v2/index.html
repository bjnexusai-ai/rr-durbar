<style>
@font-face{font-family:'Cormorant Garamond';font-style:normal;font-weight:600;font-display:swap;src:url(/assets/fonts/cormorant-garamond-latin-600-normal.woff2) format('woff2')}

@font-face{font-family:'Manrope';font-style:normal;font-weight:600;font-display:swap;src:url(/assets/fonts/manrope-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Manrope';font-style:normal;font-weight:700;font-display:swap;src:url(/assets/fonts/manrope-latin-700-normal.woff2) format('woff2')}
:root{--wine:#75131e;--deep:#33050b;--gold:#d5b26c;--gold-hi:#f6e27f;--gold-dk:#8a5a20;--cream:#fffaf3;--paper:#ffffff;--ink:#2b1718;--soft:#5b463d;--line:#ead9c0;--ok:#1f7a4d;--bad:#b3261e;

*{box-sizing:border-box}html,body{margin:0}
body{font:16px/1.5 var(--sans);color:var(--ink);background:var(--cream);padding-bottom:env(safe-area-inset-bottom)}
a{color:var(--wine)}button,input,select{font:inherit;color:inherit}
.skip{position:absolute;left:-999px;top:8px;background:var(--paper);padding:10px 14px;border-radius:10px;z-index:50}.skip:focus{left:8px}

.ck-logo{display:flex;align-items:center;gap:10px;color:var(--gold-hi);text-decoration:none;font:700 22px/1 var(--serif);letter-spacing:.02em}

.ck-back{color:var(--gold);font-weight:700;text-decoration:none;font-size:15px;padding:10px 4px}
#testbar{background:#fff3cd;color:#5c4300;border-bottom:1px solid #ffe69c;padding:6px 16px;font-size:14px;text-align:center}
.ck{max-width:1400px;margin:0 auto;padding:12px 16px 112px}
.ck-load{padding:40px 16px;text-align:center}
.ck-strip{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin:2px 0 12px}
.ck-strip h1{font:700 28px/1.1 var(--serif);color:var(--wine);margin:0}

.ck-steps{display:flex;gap:6px;list-style:none;margin:0;padding:0;flex:1 1 260px}

.ck-steps li.on{border-color:var(--gold);color:var(--ink)}.ck-steps li.done{border-color:var(--ok)}
.ck-demo{background:var(--deep);color:var(--gold-hi);border-radius:99px;padding:3px 10px;font-size:12px;font-weight:700}
.ck-grid{display:grid;gap:16px}
.ck-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:0 1px 3px rgba(51,5,11,.06)}
.ck-card+.ck-card,.ck-card+.rw,.rw+.ck-card{margin-top:14px}
h2{font:700 21px/1.2 var(--serif);color:var(--wine);margin:0 0 10px}
label{font-weight:600}.muted,small{color:var(--soft);font-size:14px}
select,input[type=tel],input[type=text]{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font-size:16px;min-height:48px}
.fld{display:block;margin:10px 0 4px}
.ph{display:flex;gap:8px;align-items:stretch}.ph span{display:flex;align-items:center;padding:0 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--cream);font-weight:700}
.chk{display:flex;gap:10px;align-items:flex-start;font-weight:400;margin:4px 0 6px}.chk input{width:22px;height:22px;margin-top:2px;flex:none;accent-color:var(--wine)}
.ck-chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.ck-chip{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;min-height:44px;font-weight:700;cursor:pointer}
.ck-chip[aria-pressed=true]{border-color:var(--gold-dk);background:#fff6e2}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:13px 18px;min-height:48px;font-weight:700;cursor:pointer;width:100%;margin-top:10px}
.btn-pri{background:linear-gradient(135deg,#f0d38a,#c99a45);color:#2a1308}.btn-dark{background:var(--wine);color:#fff}.btn-sec{background:#fff;border:1.5px solid var(--wine);color:var(--wine)}
.btn-lnk{background:none;color:var(--wine);text-decoration:underline;width:auto;min-height:44px;padding:8px;margin:0}
.btn[disabled]{opacity:.45;cursor:not-allowed}

.otp{display:flex;gap:8px;margin:10px 0 4px}

/* Rewards card v2.2: Swagramam model with the RR home-page piggy bank (same SVG art as the Royal Club section). Live text over the art. */
.rw{position:relative;overflow:hidden;border-radius:20px;color:#fff4dc;isolation:isolate;box-shadow:0 10px 28px rgba(51,5,11,.3);
  background:radial-gradient(circle at 12% 8%,rgba(255,226,154,.55),transparent 16%),radial-gradient(circle at 88% 4%,rgba(255,226,154,.5),transparent 18%),radial-gradient(circle at 60% 14%,rgba(255,170,60,.3),transparent 14%),linear-gradient(180deg,#2a0d10,#6b1a1d 62%,#9a4a1c)}
.rw-lights{position:absolute;left:0;right:0;top:0;width:100%;height:40px;pointer-events:none}
.rw-card{position:relative;display:flex;align-items:flex-end;justify-content:space-between;gap:6px;padding:26px 8px 6px 16px;min-height:168px}
.rw-txt{flex:1;min-width:0;align-self:center}
.rw-k{font:700 11px/1.2 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--gold-hi)}
.rw-n{font:700 42px/1.05 var(--serif);margin:6px 0 2px;min-height:44px;font-variant-numeric:tabular-nums;color:#e7b85c;
  background:linear-gradient(100deg,#e7b85c 40%,#fff3c8 50%,#e7b85c 60%) 200% 0/250% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.rw[data-state=open] .rw-n{animation:rwSheen 1.6s ease 1s 1 forwards}
.rw-bar{height:6px;border-radius:9px;background:rgba(255,244,220,.2);margin:6px 0 6px;overflow:hidden;max-width:220px}.rw-bar i{display:block;height:100%;width:var(--p,0%);background:linear-gradient(90deg,#9d692b,#ffe9a8);border-radius:9px;transition:width 1.2s cubic-bezier(.3,.9,.3,1) .4s}
.rw-t{font-size:13.5px;line-height:1.35;max-width:230px;min-height:36px;margin:0}
.rw-pig{width:132px;height:auto;flex:none;transform-origin:50% 92%;transition:filter .7s,opacity .7s;overflow:visible}
.rw:not([data-state=open]) .rw-pig{filter:grayscale(.7) brightness(.6);opacity:.9}
.rw[data-state=open] .rw-pig{animation:rwBreathe 4s ease-in-out infinite}.rw.fresh .rw-pig{animation:rwSquash .8s ease 1.1s 1}
.rw-pig .pile{opacity:0;transition:opacity .6s .8s}.rw[data-fill="1"] .pile.p1,.rw[data-fill="2"] .pile.p1,.rw[data-fill="2"] .pile.p2,.rw[data-fill="3"] .pile{opacity:1}
.rw-trk{position:relative;margin:0 12px 14px;height:62px;border-radius:32px;overflow:hidden;background:rgba(255,244,220,.12);border:1px solid rgba(231,184,92,.6)}
.rw-fill{position:absolute;inset:0;transform:scaleX(0);transform-origin:left;background:linear-gradient(90deg,#9d692b,#e7b85c);transition:transform .8s cubic-bezier(.3,.9,.3,1)}
.rw[data-state=open] .rw-fill{transform:scaleX(1)}
.rw-lbl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:0 12px 0 66px;text-align:center;font-weight:700;font-size:14.5px;line-height:1.25;color:#fff4dc}
.rw[data-state=locked] .rw-lbl::after,.rw[data-state=otp] .rw-lbl::after{content:" \203A\203A\203A";letter-spacing:2px;color:#e7b85c;margin-left:4px}
.rw[data-state=open] .rw-lbl{color:#33050b;padding:0 66px 0 12px}
.rw-knob{position:absolute;left:3px;top:3px;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;border:3px solid #fff4dc;
  background:radial-gradient(circle at 35% 30%,#fff7d6,#e7b85c 55%,#9d692b);box-shadow:0 0 0 3px rgba(231,184,92,.55),0 4px 14px rgba(0,0,0,.5);transition:left .8s cubic-bezier(.3,.9,.3,1);touch-action:none;cursor:grab}
.rw-knob svg{width:34px;height:34px}
.rw-knob::after{content:"\1F512";position:absolute;right:-6px;bottom:-6px;font-size:13px;line-height:1;background:#fff4dc;border-radius:50%;padding:2px}
.rw[data-state=locked] .rw-knob,.rw[data-state=otp] .rw-knob{animation:rwHalo 1.8s ease-out infinite}
.rw[data-state=verifying] .rw-knob svg{animation:rwSpin 1.2s linear infinite}
.rw[data-state=open] .rw-knob{left:calc(100% - 59px)}.rw[data-state=open] .rw-knob::after{display:none}.rw.fresh .rw-knob svg{animation:rwSpin .8s ease-out 1}
.rw.drag .rw-knob{transition:none;cursor:grabbing}
.rw[data-state=err] .rw-trk{animation:shake .4s;border-color:#ff8a7a}.rw.nudge .rw-trk{animation:rwNudge .5s}
.coin{position:absolute;width:20px;height:20px;top:-24px;left:var(--x,78%);pointer-events:none;opacity:0;animation:rwRain 1s ease-in var(--d,0s) 1 forwards}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes rwSheen{to{background-position:-100% 0}}@keyframes rwBreathe{50%{transform:scale(1.03)}}
@keyframes rwSquash{0%{transform:scale(1)}30%{transform:scale(1.12,.88)}60%{transform:scale(.94,1.08)}100%{transform:scale(1)}}
@keyframes rwSpin{to{transform:rotate(720deg)}}@keyframes rwNudge{30%{transform:translateX(8px)}60%{transform:translateX(-4px)}}
@keyframes rwHalo{0%{box-shadow:0 0 0 3px rgba(231,184,92,.55),0 0 0 0 rgba(255,226,154,.6),0 4px 14px rgba(0,0,0,.5)}100%{box-shadow:0 0 0 3px rgba(231,184,92,.55),0 0 0 16px rgba(255,226,154,0),0 4px 14px rgba(0,0,0,.5)}}
@keyframes rwRain{0%{opacity:0;transform:translateY(0) rotate(0)}15%{opacity:1}100%{opacity:0;transform:translateY(120px) rotate(360deg) scale(.6)}}
@media (max-width:360px){.rw-pig{width:108px}.rw-n{font-size:36px}}
.line{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line)}
.line .nm{font-weight:600}.line.bad .nm{color:var(--bad)}.line>b,.row>span:last-child{white-space:nowrap}
#s-offers,.ck-sum,#s-pay{margin-top:22px}
.qty{display:inline-flex;align-items:center;gap:6px;margin-top:4px}.qty button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--cream);font-size:18px;cursor:pointer}
.row{display:flex;justify-content:space-between;gap:12px;padding:5px 0}.row.t{border-top:1px solid var(--line);margin-top:6px;padding-top:10px;font-weight:700;font-size:19px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:12px;padding:12px;margin:8px 0;cursor:pointer;font-weight:600}.opt input{width:20px;height:20px;accent-color:var(--wine);margin-top:2px}
.opt:has(input:checked){border-color:var(--gold-dk);background:#fff8ea}
#s-offers[inert]{opacity:.5}
.lock{display:flex;gap:8px;align-items:center;background:var(--cream);border-radius:12px;padding:10px 12px;font-weight:600}
.ck-gap{display:none}
.ck-bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--deep);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.ck-bar .tot{flex:1}.ck-bar small{color:var(--gold);font-size:12px;letter-spacing:.08em;text-transform:uppercase}.ck-bar b{display:block;font-size:20px}
.ck-bar .btn{width:auto;margin:0;flex:1.4}
.ck-ft{text-align:center;color:var(--soft);font-size:14px;padding:16px 16px 100px}
.ck-dlg{border:0;border-radius:16px;max-width:520px;width:calc(100% - 32px);padding:20px}.ck-dlg::backdrop{background:rgba(20,4,8,.55)}
.big{font:700 34px/1.1 var(--serif);color:var(--wine)}
.pill{display:inline-block;background:var(--wine);color:#fff;border-radius:99px;padding:2px 10px;font-size:13px;font-weight:700}
.hidden{display:none!important}
@media (min-width:1024px){
  .ck{padding-bottom:24px}.ck-bar{display:none}.ck-ft{padding-bottom:16px}
  .ck-grid{grid-template-columns:minmax(0,34fr) 56px minmax(0,62fr);gap:0;align-items:start}
  .ck-gap{display:flex;align-self:stretch;justify-content:center;position:relative}
  .ck-gap::before{content:"";position:absolute;top:8px;bottom:8px;left:50%;width:2px;background:linear-gradient(var(--line),var(--gold),var(--line))}
  .ck-gap span{position:relative;margin-top:120px;width:32px;height:32px;border-radius:50%;background:var(--gold);color:var(--deep);display:grid;place-items:center;font-weight:700}
  .ck-main .ck-top{display:grid;grid-template-columns:1.25fr 1fr;gap:18px}
  #s-offers,.ck-sum,#s-pay{margin-top:0}
  .ck-main .ck-bot{display:grid;grid-template-columns:1fr 1fr;gap:18px;border-top:1px solid var(--line);margin-top:14px;padding-top:14px}
}
/* One screen on desktop: only the order page (class two), only when the window is tall enough. */
@media (min-width:1024px) and (min-height:680px){
  body:has(#ck.two){height:100dvh;overflow:hidden;display:flex;flex-direction:column}

}
/* Tip, coupons, points, richer confirmation (v2.1, Swagramam model) */
.tipcard{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
.tipcard h3{font:700 18px/1.2 var(--serif);color:var(--wine);margin:0 0 4px}

.cp .btn{width:auto;margin:0;min-height:40px;padding:8px 16px}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ===== LIVE API (contract v1.1) ===== */
function call(path, opt) {
  opt = opt || {}; var h = { Accept: 'application/json' }, url = CFG.API + path;
  if (opt.body) h['Content-Type'] = 'application/json';
  if (opt.auth && S.token) h.Authorization = 'Bearer ' + S.token;
  if (opt.idem) h['Idempotency-Key'] = opt.idem;
  if (opt.query) url += '?' + new URLSearchParams(opt.query).toString();
  return fetch(url, { method: opt.method || (opt.body ? 'POST' : 'GET'), headers: h, body: opt.body ? JSON.stringify(opt.body) : undefined }).then(function (r) {
    return r.json().catch(function () { return null; }).then(function (j) { if (!r.ok) { var e = (j && j.error) || {}; throw dErr(e.code || 'http_' + r.status, e.message || 'Something went wrong. Please try again.', e.field); } if (!j) throw dErr('provider_down', 'The server is not responding. Please try again.'); return j; });
  }, function () { throw dErr('provider_down', 'We cannot reach our server right now. Please check your connection and try again.'); });
}

function slotLabel() { var s = (S.slots || []).filter(function (x) { return x.id === S.slot; })[0]; return s ? s.label : ''; }
function verified() { return S.otp === 'open' && !!S.token; }
function phoneOk() { return /^[6-9]\d{9}$/.test(S.phone); }
function codOk() { var o = outletObj(); return !!(S.quote && o && o.codAllowed && S.cfg && S.quote.totalPaise <= S.cfg.codMaxPaise); }

    customer: { name: S.name, email: '' }, consent: { terms: true, marketing: false, version: (S.cfg && S.cfg.termsVersion) || '' }, expectedTotalPaise: S.quote.totalPaise };
  var qb = quoteBody(); if (qb.tip) body.tip = qb.tip; if (qb.offer) body.offer = qb.offer;   // contract v1.2 fields, only when announced
  API.start(body, S.idem).then(function (r) {
    S.order = { orderId: r.orderId, statusToken: r.statusToken, method: S.method, tipPaise: S.quote.tipPaise || 0, discountPaise: S.quote.discountPaise || 0, discountLabel: S.quote.discountLabel || '',
      items: S.quote.items.map(function (i) { return { name: i.displayName || i.name, qty: i.qty }; }) };
    if (r.payment && r.payment.demo) { S.busy = false; return view('paydemo'); }
    if (r.payment) return submitPayu(r.payment);
    poll(r.orderId);
  }, function (e) {
    S.busy = false;
    if (e.code === 'quote_mismatch') { S.err = 'The price changed a moment ago. Please check the new total and try again.'; S.idem = ''; requote(); }
    else if (e.code === 'slot_invalid') { S.err = 'That pickup time is no longer available. Please choose another.'; S.slot = ''; S.pickupOpen = true; S.idem = ''; chooseOutlet(S.outlet); }
    else if (e.code === 'token_invalid') { S.err = 'Please verify your mobile again.'; S.idem = ''; editPhone(); }
    else S.err = e.msg || 'Something went wrong. Nothing has been charged. Please try again.';
    paintPay();
  });
}
function submitPayu(p) {
  if (!p || !/^https:\/\/(secure|test)\.payu\.in\//.test(p.action || '')) { S.busy = false; S.err = 'The payment could not be started. Nothing has been charged.'; return paintPay(); }
  var f = document.createElement('form'); f.method = 'POST'; f.action = p.action; f.style.display = 'none';
  Object.keys(p.fields || {}).forEach(function (k) { var i = document.createElement('input'); i.type = 'hidden'; i.name = k; i.value = p.fields[k]; f.appendChild(i); });
  document.body.appendChild(f); f.submit();
}
function poll(id, n) {
  n = n || 0; view('wait');
  return API.status(id, S.order && S.order.statusToken).then(function (o) {
    if (o.state === 'CONFIRMED') { S.order = Object.assign({}, S.order, o, { items: o.items || S.order.items, tipPaise: o.tipPaise != null ? o.tipPaise : S.order.tipPaise, discountPaise: o.discountPaise != null ? o.discountPaise : S.order.discountPaise }); try { localStorage.removeItem('rr_cart_v2'); } catch (e) {} return view('done'); }
    if (o.state === 'PAYMENT_FAILED' || o.state === 'EXPIRED') return view('failed');
    if (n >= 40) { S.err = 'We could not confirm your order yet. If money was taken, it will be refunded or the order confirmed shortly. Please call the outlet.'; return view('failed'); }
    return sleep(1500).then(function () { return poll(id, n + 1); });
  }, function () { if (n >= 5) { S.err = 'We cannot check your order right now. Please call the outlet with your order number.'; return view('failed'); } return sleep(2000).then(function () { return poll(id, n + 1); }); });
}

/* ===== OTHER VIEWS (no one-screen class, so nothing is clipped) ===== */
function view(v) {
  S.view = v; var ck = $('#ck'); ck.classList.remove('two'); window.scrollTo(0, 0);
  if (v === 'order') return renderOrder();
  if (v === 'empty') ck.innerHTML = '<div class="ck-card" style="max-width:560px;margin:24px auto"><h1 class="big">Your cart is empty</h1><p>Choose your dishes first, then come back here to pick up your order.</p><a class="btn btn-pri" href="/?page=pickup-menu">Choose dishes</a>' + (MOCK ? '<button class="btn btn-sec" data-act="sample" type="button">Load a sample cart (demo)</button>' : '') + '</div>';
  if (v === 'closed') ck.innerHTML = '<div class="ck-card" style="max-width:560px;margin:24px auto"><h1 class="big">Online ordering is not open yet</h1><p>Please call us to order for pickup, or order on WhatsApp.</p><a class="btn btn-pri" href="tel:' + CFG.CALL + '">Call to order</a><a class="btn btn-sec" href="https://wa.me/917702077999">WhatsApp</a></div>';
  if (v === 'paydemo') ck.innerHTML = '<div class="ck-card" style="max-width:560px;margin:24px auto"><p><span class="pill">Demo</span> This is a pretend payment page. No money moves.</p><div class="row t"><span>Order ' + esc(S.order.orderId) + '</span><span>' + rs(S.quote.totalPaise) + '</span></div><button class="btn btn-pri" data-act="mp" data-ok="1" type="button">Pretend the payment worked</button><button class="btn btn-sec" data-act="mp" data-ok="0" type="button">Pretend the payment failed</button></div>';
  if (v === 'wait') ck.innerHTML = '<div class="ck-card" style="max-width:560px;margin:24px auto"><h1 class="big">Confirming your order&hellip;</h1><p>Please wait and do not close this page.</p></div>';
  if (v === 'done') { var o = S.order, cod = o.method === 'cod';
    ck.innerHTML = '<div class="ck-card" style="max-width:560px;margin:24px auto"><div class="done-hd"><div class="done-ok" aria-hidden="true">&#10003;</div>' +
    '<h1 class="big">' + (cod ? 'Order placed' : 'Order confirmed') + (MOCK ? ' <span class="pill">Demo</span>' : '') + '</h1>' +
    '<p class="okmsg" style="margin:4px 0">' + (cod ? 'Pay at the counter when you collect.' : 'Payment received. The kitchen has your order.') + '</p>' +
    '<div class="done-no" id="h-id">' + esc(o.orderId) + '</div><p class="muted" style="margin:0 0 10px">Show this number at the counter.</p></div>' +
    '<div class="row"><span>Outlet</span><b>' + esc(o.branchName || outName()) + '</b></div><div class="row"><span>Ready at</span><b>' + esc(o.slotLabel || slotLabel()) + '</b></div>' +
    (o.discountPaise ? '<div class="row disc"><span>Discount' + (o.discountLabel ? ' (' + esc(o.discountLabel) + ')' : '') + '</span><span>&minus; ' + rs(o.discountPaise) + '</span></div>' : '') +
    (o.freeItem ? '<div class="row disc"><span>' + esc(o.freeItem.split(':')[0]) + '</span><span>Collect at the counter</span></div>' : '') +
    (o.tipPaise ? '<div class="row"><span>Tip</span><b>' + rs(o.tipPaise) + '</b></div>' : '') +
    '<div class="row t"><span>' + (cod ? 'To pay at pickup' : 'Total paid') + '</span><span>' + rs(o.totalPaise || (S.quote && S.quote.totalPaise) || 0) + '</span></div>' +
    (o.items && o.items.length ? '<p class="done-items">' + o.items.map(function (i) { return i.qty + ' x ' + esc(i.name); }).join(', ') + '</p>' : '') +
    (o.earnPoints ? '<div class="done-earn">You will earn <b>' + o.earnPoints + '</b> RR Durbar points ' + (cod ? 'after you pay at the counter.' : 'on this order.') + '</div>' : '') +
    '<p class="muted">Keep this page or note your order number. For help call <a href="tel:' + CFG.CALL + '">+91 77020 77999</a>.</p><a class="btn btn-pri" href="/?page=pickup-menu">Order more</a><a class="btn btn-sec" href="/">Back to home</a></div>'; }
  if (v === 'failed') ck.innerHTML = '<div class="ck-card" style="max-width:560px;margin:24px auto"><h1 class="big">Payment not completed</h1><p>' + esc(S.err || 'Your payment did not go through and your order has not been placed. You have not been charged.') + '</p><button class="btn btn-pri" data-act="retry" type="button">Try again</button><a class="btn btn-sec" href="tel:' + CFG.CALL + '">Call the outlet</a></div>';
}

/* ===== DIALOG ===== */
var DLG = { terms: ['Terms', 'Read the full Terms of Service on our website. By ticking the box you agree to them and to the rewards club terms. You can ask us to stop at any time.', '/?page=terms-of-service'],
  privacy: ['Privacy', 'We use your mobile number to verify your order, to tell the outlet who is collecting, and for rewards. Read the full Privacy Policy on our website.', '/?page=privacy-policy'] };
function openDlg(k) { var d = $('#ck-dlg'), t = DLG[k]; if (!d || !t) return; d.innerHTML = '<h2 id="ck-dlg-t">' + esc(t[0]) + '</h2><p>' + esc(t[1]) + '</p><a href="' + t[2] + '" target="_blank" rel="noopener">Open the full page</a><button class="btn btn-dark" type="button" data-act="closedlg">Close</button>'; if (d.showModal) d.showModal(); else d.setAttribute('open', ''); }

/* ===== TURNSTILE (only when a site key is set) ===== */
function setupTurnstile() {
  if (!CFG.TURNSTILE_SITEKEY || MOCK) return;
  window.rrTsOk = function (t) { S.tsToken = t; if (S.pendingSend) maybeSend(); };
  var s = document.createElement('script'); s.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?onload=rrTsLoad'; s.async = true; s.defer = true;
  window.rrTsLoad = function () { var box = document.createElement('div'); box.id = 'ck-tsw'; var m = $('#s-mobile'); if (m) m.insertBefore(box, $('#ck-formerr')); window.turnstile.render('#ck-tsw', { sitekey: CFG.TURNSTILE_SITEKEY, callback: window.rrTsOk, 'refresh-expired': 'auto' }); };
  document.head.appendChild(s);
}
function resetTurnstile() { S.tsToken = ''; try { if (window.turnstile) window.turnstile.reset('#ck-tsw'); } catch (e) {} }

/* ===== EVENTS (one delegated set) ===== */
document.addEventListener('click', function (ev) {
  var t = ev.target.closest('[data-act],[data-time],[data-dlg]'); if (!t) return;
  if (t.hasAttribute('data-dlg')) { ev.preventDefault(); return openDlg(t.getAttribute('data-dlg')); }
  if (t.hasAttribute('data-time')) { S.slot = t.getAttribute('data-time'); $$('.ck-chip[data-time]').forEach(function (c) { c.setAttribute('aria-pressed', String(c === t)); }); var pb = $('#ck-pickbody'); if (pb && !$('[data-act=next]', pb)) paintPickup(); paintSteps(); paintPay(); return; }
  var a = t.getAttribute('data-act');
  if (a === 'next') { S.pickupOpen = false; paintPickup(); var p = $('#ck-ph'); if (p && !S.sent) p.focus(); else if (S.sent) $('#ck-o0').focus(); return; }
  if (a === 'change') { S.pickupOpen = true; paintPickup(); var sel = $('#ck-outlet'); if (sel) sel.focus(); return; }
  if (a === 'verify') return verify();
  if (a === 'resend') { if (S.resend > 0) return; return sendOtp(); }
  if (a === 'editphone') return editPhone();
  if (a === 'place' || a === 'barplace') return place();
  if (a === 'requote') return requote();
  if (a === 'inc' || a === 'dec') { var it = S.quote && S.quote.items[+t.getAttribute('data-k')]; if (!it) return; var c = S.cart.filter(function (x) { return x.id === it.id; })[0]; if (!c) return; c.qty = Math.max(0, Math.min(20, c.qty + (a === 'inc' ? 1 : -1))); S.cart = S.cart.filter(function (x) { return x.qty > 0; }); saveCart(); S.idem = ''; if (!S.cart.length) return view('empty'); return requote(); }
  if (a === 'sample') { S.cart = SAMPLE.map(function (x) { return Object.assign({}, x); }); saveCart(); return view('order'); }
  if (a === 'mp') { var ok = t.getAttribute('data-ok') === '1'; view('wait'); return demo.pay(S.order.orderId, ok).then(function () { return poll(S.order.orderId); }); }
  if (a === 'retry') { S.err = ''; S.idem = ''; S.busy = false; view('order'); return requote(); }
  if (a === 'closedlg') { var d = $('#ck-dlg'); if (d.close) d.close(); else d.removeAttribute('open'); }
  if (a === 'coupons') return openCoupons();
  if (a === 'cpapply' || a === 'cpcode') { var cc = a === 'cpapply' ? t.getAttribute('data-code') : ($('#ck-cpin').value || '').trim().toUpperCase(); if (!cc) { $('#ck-cperr').textContent = 'Enter a code.'; return; }
    var hit = a === 'cpcode' && S.offers && S.offers.coupons.filter(function (x) { return x.code === cc; })[0];
    if (a === 'cpcode' && hit && !hit.eligible) { $('#ck-cperr').textContent = hit.reason; return; }
    var dd = $('#ck-dlg'); if (dd.close) dd.close(); else dd.removeAttribute('open'); return setOffer({ kind: 'coupon', code: cc }); }
  if (a === 'rmoffer') return setOffer(null);
  if (a === 'reward') return setOffer({ kind: 'reward', rewardId: t.getAttribute('data-id') });
});
document.addEventListener('click', function (ev) {
  var t = ev.target.closest('[data-tip]'); if (!t) return;
  var v = t.getAttribute('data-tip');
  if (v === 'other') { var was = S.tipOther || !!(S.tip && S.tip.paise); S.tipOther = !was; S.tip = null; S.idem = ''; paintTip(); var ti = $('#ck-tipamt'); if (ti) ti.focus(); return requote(true); }
  var p = +v; S.tipOther = false; S.tip = S.tip && S.tip.pct === p ? null : { pct: p }; S.idem = ''; paintTip(); requote(true);
});
document.addEventListener('change', function (ev) {
  var t = ev.target;
  if (t.id === 'ck-outlet') return chooseOutlet(t.value);
  if (t.id === 'ck-terms') { S.terms = t.checked; if (t.checked) { $('#ck-formerr').textContent = ''; if (S.pendingSend || (phoneOk() && !S.sent)) maybeSend(); } return; }
  if (t.name === 'ck-pm') { S.method = t.value; S.err = ''; S.idem = ''; return paintPay(); }
});
document.addEventListener('input', function (ev) {
  var t = ev.target;
  if (t.id === 'ck-ph') { t.value = t.value.replace(/\D/g, '').slice(0, 10); S.phone = t.value; $('#ck-formerr').textContent = ''; if (S.phone.length === 10 && !S.sent) maybeSend(); return; }
  if (t.id === 'ck-nm') { S.name = t.value.trim().slice(0, 60); return; }
  if (t.id === 'ck-tipamt') { t.value = t.value.replace(/\D/g, '').slice(0, 3); var rup = +t.value || 0; S.tip = rup > 0 ? { paise: Math.min(rup, 500) * 100 } : null; S.idem = ''; clearTimeout(requote.t); requote.t = setTimeout(function () { requote(true); }, 400); return; }
  if (/^ck-o\d$/.test(t.id)) {
    var v = t.value.replace(/\D/g, '');
    if (v.length > 1) return fill(v);
    t.value = v; if (S.otp === 'locked' || S.otp === 'err') { S.otp = 'otp'; paintCard(); }
    if (v) { var nx = $('#ck-o' + (+t.id.slice(4) + 1)); if (nx) nx.focus(); }
    if (code().length === CFG.OTP_LEN) verify();
  }
});
document.addEventListener('keydown', function (ev) {
  var t = ev.target; if (!/^ck-o\d$/.test(t.id || '')) return;
  var i = +t.id.slice(4);
  if (ev.key === 'Backspace' && !t.value && i > 0) { var p = $('#ck-o' + (i - 1)); p.value = ''; p.focus(); ev.preventDefault(); }
  if (ev.key === 'ArrowLeft' && i > 0) $('#ck-o' + (i - 1)).focus();
  if (ev.key === 'ArrowRight' && i < CFG.OTP_LEN - 1) $('#ck-o' + (i + 1)).focus();
});
document.addEventListener('paste', function (ev) {
  if (!/^ck-o\d$/.test((ev.target && ev.target.id) || '')) return;
  var txt = (ev.clipboardData || window.clipboardData).getData('text'); if (!/\d/.test(txt)) return; ev.preventDefault(); fill(txt);
});
/* The coin never unlocks by itself: only the right code does. Dragging it most of the way (or tapping the track) takes you to the next field. */
function rwNext() { var rw = $('.rw'); if (!rw || verified()) return; rw.classList.add('nudge'); setTimeout(function () { rw.classList.remove('nudge'); }, 600);
  var f = !phoneOk() ? $('#ck-ph') : !S.terms ? $('#ck-terms') : $('#ck-o0'); if (f && !f.disabled) { f.focus(); if (f.scrollIntoView) f.scrollIntoView({ behavior: REDUCED ? 'auto' : 'smooth', block: 'center' }); } }
(function () {
  var d = null, swAt = 0;
  document.addEventListener('pointerdown', function (ev) { var k = ev.target.closest && ev.target.closest('.rw-knob'), rw = k && k.closest('.rw'); if (!rw || verified() || S.otp === 'verifying') return;
    d = { k: k, rw: rw, x0: ev.clientX, dx: 0, max: Math.max(1, rw.querySelector('.rw-trk').clientWidth - k.offsetWidth - 6) }; rw.classList.add('drag'); try { k.setPointerCapture(ev.pointerId); } catch (e) {} });
  document.addEventListener('pointermove', function (ev) { if (!d) return; d.dx = Math.max(0, Math.min(d.max, ev.clientX - d.x0)); d.k.style.transform = 'translateX(' + d.dx + 'px)'; });
  function end() { if (!d) return; var x = d; d = null; x.rw.classList.remove('drag'); x.k.style.transform = ''; if (x.dx > 6) swAt = Date.now(); if (x.dx > x.max * 0.6 || x.dx <= 6) rwNext(); }
  document.addEventListener('pointerup', end); document.addEventListener('pointercancel', end);
  document.addEventListener('click', function (ev) { if (Date.now() - swAt < 400) return; var tr = ev.target.closest && ev.target.closest('.rw-trk'); if (tr && !ev.target.closest('.rw-knob')) rwNext(); });
})();

/* ===== START ===== */
(function start() {
  if (MOCK) { var tb = $('#testbar'); tb.hidden = false; tb.innerHTML = '<b>DEMO MODE</b>: pretend code, pretend payment, pretend rewards. No real orders or money.'; }
  // Return from PayU: /checkout/v2/?order=RR-1&t=... (the status token is removed from the address bar at once)
  if (!MOCK && Q.get('order') && Q.get('t')) { S.order = { orderId: Q.get('order'), statusToken: Q.get('t') }; history.replaceState(null, '', location.pathname); return API.config().then(function (c) { S.cfg = c; }, function () {}).then(function () { poll(S.order.orderId); }); }
  loadCart();
  API.config().then(function (c) {
    S.cfg = c; if (!c.orderingOpen) return view('closed');
    if (!S.cart.length) return view('empty');
    if (S.outlet && !outletObj()) S.outlet = '';
    view('order'); setupTurnstile(); if (S.outlet) chooseOutlet(S.outlet);
  }, function () { $('#ck').innerHTML = '<div class="ck-card" style="max-width:560px;margin:24px auto"><h1 class="big">We cannot open checkout right now</h1><p>Please try again in a few minutes, or call us to order.</p><a class="btn btn-pri" href="tel:' + CFG.CALL + '">Call to order</a></div>'; });
})();
})();
</script>
